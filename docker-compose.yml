# Build-from-source compose (local development, or a stack manager that builds
# from a Git checkout). For a prebuilt image use deploy/compose.yaml instead.
# Variables come from .env / the stack environment (see .env.example).
services:
  zeprint:
    build: .
    image: zeprint:local
    container_name: zeprint
    restart: unless-stopped
    ports:
      - "${ZEPRINT_HTTP_PORT:-3231}:8080"
    volumes:
      - zeprint-data:/data            # config.json, caches, plugins/
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      # First-run printer: the networked GX430t on its raw port. After the
      # first start, manage printers (address, DPI, label size) in the web UI.
      ZEPRINT_PRINTER_URI: ${ZEPRINT_PRINTER_URI:-tcp://192.168.1.50:9100}
      ZEPRINT_PRINTER_NAME: ${ZEPRINT_PRINTER_NAME:-Zebra GX430t}
      ZEPRINT_PRINTER_DPI: ${ZEPRINT_PRINTER_DPI:-300}
      ZEPRINT_LABEL_SIZE: ${ZEPRINT_LABEL_SIZE:-4x6}
      ZEPRINT_API_TOKEN: ${ZEPRINT_API_TOKEN:-}
      ZEPRINT_URL: ${ZEPRINT_URL:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    # (USB instead of network: see "Connecting the printer" in the README)

volumes:
  zeprint-data:
