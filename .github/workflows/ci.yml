name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zeprint:ci
      - name: Smoke test the image
        run: |
          docker run -d --name zp -p 8080:8080 zeprint:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs -X POST localhost:8080/api/labels/test/preview -o preview.png
          file preview.png | grep -q PNG
          docker logs zp
